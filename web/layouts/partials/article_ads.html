{{- /* AdSense In-Article slot. Reserve space before the script fills it to keep CLS low. */ -}}
{{- $slot := .slot | default "auto" -}}
{{- $client := site.Params.googleAdSense -}}
{{- $enabled := and $client (ne $client "disabled") -}}
<div class="adsense-slot" data-ad-slot="{{ $slot }}" aria-label="advertisement">
{{- if $enabled -}}
  <ins class="adsbygoogle"
       style="display:block; text-align:center;"
       data-ad-layout="in-article"
       data-ad-format="fluid"
       data-ad-client="{{ $client }}"
       data-ad-slot="{{ $slot }}"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
{{- end -}}
</div>
