<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>페이지를 찾을 수 없습니다 | InvestIQs</title>

    :root {
      color-scheme: light dark;

    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #111827;
    }
    main {
      width: min(92vw, 42rem);
      padding: 3rem 1.25rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
    }
    p {
      margin: 0 0 1.5rem;
      color: #4b5563;
    }
    a {
      color: #0f766e;
      font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #f8fafc;
      }
      p {
        color: #cbd5e1;
      }
      a {
        color: #5eead4;
      }
    }
  </style>
</head>
