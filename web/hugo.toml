baseURL = 'https://investiqs.net/'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = true
theme = 'PaperMod'
summaryLength = 20

[sitemap]
  changefreq = "weekly"
  priority = 0.7
  filename = "sitemap.xml"

[minify]
  disableXML = false
  minifyOutput = true

[imaging]
  resampleFilter = "CatmullRom"
  quality = 82
  anchor = "smart"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  # 택소노미(tags/categories) RSS .xml 생성 차단 — 크롤 예산 낭비 + thin content 방지
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  googleAdSense = "ca-pub-3459019439429067"
  ai_content_policy = "https://investiqs.net/ko/about/editorial-policy/"
  enableRobotsTXT = true
  canonifyURLs = true
  mainSections = ["study", "blog"]

  # 커버 이미지 없는 페이지의 기본 og:image
  images = ["/images/og-default.png"]

  [params.assets]
    disableHLJS = true

  [params.schema]
    publisherName = "InvestIQs"
    publisherLogo = "/images/logo-512.png"
    publisherType = "Organization"
    sameAs = [
      "https://twitter.com/investiqs",
      "https://www.linkedin.com/company/investiqs"
    ]

